name: Build My Float APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          java-version: '17'
      - run: flutter --version && java -version
      - run: |
          rm -rf android ios web linux macos windows test .dart_tool
          flutter create . --project-name my_float --org com.myfloat.app --platforms android
      - run: |
          cat > lib/main.dart << 'DART'
          import 'package:flutter/material.dart';
          void main() => runApp(MaterialApp(home: Scaffold(appBar: AppBar(title: Text("My Float"), backgroundColor: Colors.green, foregroundColor: Colors.white), body: Center(child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [Icon(Icons.account_balance_wallet, size: 80, color: Colors.green), SizedBox(height: 20), Text("KES 0", style: TextStyle(fontSize: 40, fontWeight: FontWeight.bold)), SizedBox(height: 10), Text("My Float - M-Pesa Tracker", style: TextStyle(fontSize: 16)), SizedBox(height: 30), ElevatedButton(onPressed: (){}, child: Text("Float IN - LIVE BUILD!"))])))));
          DART
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: my-float-apk
          path: build/app/outputs/flutter-apk/app-release.apk
