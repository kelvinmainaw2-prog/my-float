name: Build My Float APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - run: |
          flutter create /tmp/base --project-name my_float --org com.myfloat.app
          cp -r /tmp/base/android ./
          cp -r /tmp/base/ios ./ || true
          rm -rf /tmp/base
      - run: |
          cat > pubspec.yaml << 'YAML'
          name: my_float
          description: My Float - M-Pesa Float Tracker
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            shared_preferences: ^2.2.2
            fl_chart: ^0.65.0
            intl: ^0.19.0
          flutter:
            uses-material-design: true
          YAML
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: my-float-apk
          path: build/app/outputs/flutter-apk/app-release.apk
